server:
  port: ${NUS_SERVER_PORT:48080}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  ai:
    model:
      chat: none
      embedding: none
      image: none
      audio:
        transcription: none
        speech: none
      moderation: none
  datasource:
    druid:
      web-stat-filter:
        enabled: ${NUS_DRUID_ENABLED:true}
      stat-view-servlet:
        enabled: ${NUS_DRUID_ENABLED:true}
        allow: ${NUS_DRUID_ALLOW:127.0.0.1,172.16.0.0/12}
        url-pattern: /druid/*
        reset-enable: false
      filter:
        stat:
          enabled: ${NUS_DRUID_ENABLED:true}
          log-slow-sql: true
          slow-sql-millis: 500
          merge-sql: true
    dynamic:
      primary: master
      strict: true
      druid:
        initial-size: 1
        min-idle: 1
        max-active: 20
        max-wait: 60000
        time-between-eviction-runs-millis: 60000
        min-evictable-idle-time-millis: 600000
        max-evictable-idle-time-millis: 1800000
        validation-query: SELECT 1
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
      datasource:
        master:
          url: jdbc:mysql://${NUS_DB_HOST:mysql}:${NUS_DB_PORT:3306}/${NUS_DB_NAME:nus}?useSSL=${NUS_DB_USE_SSL:false}&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
          username: ${NUS_DB_USERNAME:nus}
          password: ${NUS_DB_PASSWORD}
  data:
    redis:
      host: ${NUS_REDIS_HOST:redis}
      port: ${NUS_REDIS_PORT:6379}
      database: ${NUS_REDIS_DATABASE:0}
      password: ${NUS_REDIS_PASSWORD}
  quartz:
    auto-startup: true
    scheduler-name: nus-scheduler
    job-store-type: jdbc
    wait-for-jobs-to-complete-on-shutdown: true
    jdbc:
      initialize-schema: never
  boot:
    admin:
      context-path: /admin
      server:
        enabled: ${NUS_SPRING_BOOT_ADMIN_ENABLED:true}
      client:
        enabled: ${NUS_SPRING_BOOT_ADMIN_ENABLED:true}
        url: http://127.0.0.1:${server.port}/admin
        username: ${NUS_MONITOR_USERNAME}
        password: ${NUS_MONITOR_PASSWORD}
        instance:
          service-base-url: http://127.0.0.1:${server.port}
          management-base-url: http://127.0.0.1:${management.server.port}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

knife4j:
  enable: false

management:
  server:
    port: ${NUS_MANAGEMENT_PORT:48081}
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus,loggers,threaddump
  endpoint:
    health:
      show-details: never

logging:
  file:
    name: ${NUS_LOG_FILE:/app/logs/nus-server.log}

nus:
  production-mode: true
  captcha:
    enable: true
  security:
    mock-enable: false
    password-encoder-length: ${NUS_PASSWORD_ENCODER_STRENGTH:12}
    permit-all-urls:
      - /druid/**
  monitor-access:
    ticket-ttl: ${NUS_MONITOR_TICKET_TTL:45s}
    session-ttl: ${NUS_MONITOR_SESSION_TTL:20m}
    cookie-secure: ${NUS_MONITOR_COOKIE_SECURE:false}
    skywalking-url: ${NUS_SKYWALKING_URL:http://127.0.0.1:8082/}
    horizon-internal-url: ${NUS_HORIZON_INTERNAL_URL:http://skywalking-ui:8081}
    horizon-username: ${NUS_MONITOR_USERNAME}
    horizon-password: ${NUS_MONITOR_PASSWORD}
  admin-bootstrap:
    enabled: ${NUS_ADMIN_BOOTSTRAP_ENABLED:false}
    username: ${NUS_ADMIN_BOOTSTRAP_USERNAME:admin}
    password-file: ${NUS_ADMIN_BOOTSTRAP_PASSWORD_FILE:}
  access-log:
    enable: true
  api-encrypt:
    enable: ${NUS_API_ENCRYPT_ENABLED:false}
    request-key: ${NUS_API_ENCRYPT_REQUEST_KEY}
    response-key: ${NUS_API_ENCRYPT_RESPONSE_KEY}
  edu:
    ai-review:
      enabled: ${NUS_AI_REVIEW_ENABLED:false}
      task-pool-size: ${NUS_AI_REVIEW_TASK_POOL_SIZE:2}
      task-queue-capacity: ${NUS_AI_REVIEW_TASK_QUEUE_CAPACITY:100}
      ffmpeg-command: ${NUS_FFMPEG_COMMAND:/usr/bin/ffmpeg}
      ffprobe-command: ${NUS_FFPROBE_COMMAND:/usr/bin/ffprobe}
      audio-transcription-python: ${NUS_VOSK_PYTHON:/opt/nus/venv/bin/python}
      audio-transcription-script: ${NUS_VOSK_SCRIPT:/opt/nus/scripts/vosk_transcribe.py}
      audio-transcription-model-dir: ${NUS_VOSK_MODEL_DIR:/opt/nus/models/vosk-model-small-cn-0.22}
      image-ocr-command: []
      work-dir: ${NUS_AI_REVIEW_WORK_DIR:/app/tmp/nus-ai-review}
      max-attachment-count: ${NUS_AI_REVIEW_MAX_ATTACHMENTS:5}
      max-attachment-bytes: ${NUS_AI_REVIEW_MAX_ATTACHMENT_BYTES:20971520}

justauth:
  enabled: true # 钉钉凭据由社交客户端数据库配置提供，启用工厂以使用 Redis state 缓存

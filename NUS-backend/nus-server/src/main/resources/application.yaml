spring:
  application:
    name: nus-server

  main:
    allow-circular-references: true # 允许循环依赖，因为项目是三层架构，无法避免这个情况。

  # 默认异步线程池：供 @Async 与 Spring MVC SSE 使用，AI 批改继续使用独立线程池
  task:
    execution:
      mode: force # 即使业务声明了自定义 Executor，也保留 applicationTaskExecutor
      thread-name-prefix: nus-async-
      pool:
        core-size: 8
        max-size: 32
        queue-capacity: 500
        keep-alive: 60s
        allow-core-thread-timeout: true
      shutdown:
        await-termination: true
        await-termination-period: 30s

  # Servlet 配置
  servlet:
    # 文件上传相关配置项
    multipart:
      max-file-size: 500MB # 单个文件大小上限，与课程资源上传能力保持一致
      max-request-size: 520MB # 请求总大小，预留 multipart 边界与表单字段开销

  # Jackson 配置项
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss # Date 类型统一输出格式
    time-zone: GMT+8 # 统一时区，避免前后端时区偏差
    serialization:
      write-dates-as-timestamps: false # Date/时间类型统一返回格式化字符串
      write-date-timestamps-as-nanoseconds: false # 设置不使用 nanoseconds 的格式。例如说 1611460870.401，而是直接 1611460870401
      write-durations-as-timestamps: true # 设置 Duration 的格式，使用时间戳
      fail-on-empty-beans: false # 允许序列化无属性的 Bean

  # Cache 配置项
  cache:
    type: REDIS
    redis:
      time-to-live: 1h # 设置过期时间为 1 小时

server:
  servlet:
    encoding:
      enabled: true
      charset: UTF-8 # 必须设置 UTF-8，避免 WebFlux 流式返回（AI 场景）会乱码问题
      force: true

--- #################### 接口文档配置 ####################

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui
  default-flat-param-object: true # 参见 https://doc.xiaominfo.com/docs/faq/v4/knife4j-parameterobject-flat-param 文档

knife4j:
  enable: true
  setting:
    language: zh_cn

# MyBatis Plus 的配置项
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # 虽然默认为 true ，但是还是显示去指定下。
  global-config:
    db-config:
      id-type: NONE # “智能”模式，基于 IdTypeEnvironmentPostProcessor + 数据源的类型，自动适配成 AUTO、INPUT 模式。
      #      id-type: AUTO # 自增 ID，适合 MySQL 等直接自增的数据库
      #      id-type: INPUT # 用户输入 ID，适合 Oracle、PostgreSQL、Kingbase、DB2、H2 数据库
      #      id-type: ASSIGN_ID # 分配 ID，默认使用雪花算法。注意，Oracle、PostgreSQL、Kingbase、DB2、H2 数据库时，需要去除实体类上的 @KeySequence 注解
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)
    banner: false # 关闭控制台的 Banner 打印
  type-aliases-package: ${nus.info.base-package}.module.*.dal.dataobject
  encryptor:
    password: ${NUS_MYBATIS_ENCRYPTOR_PASSWORD:local-only-not-a-secret}

mybatis-plus-join:
  banner: false # 是否打印 mybatis plus join banner，默认true
  sub-table-logic: true # 全局启用副表逻辑删除，默认true。关闭后关联查询不会加副表逻辑删除
  ms-cache: true # 拦截器MappedStatement缓存，默认 true
  table-alias: t # 表别名(默认 t)
  logic-del-type: on # 副表逻辑删除条件的位置，支持 WHERE、ON，默认 ON

# Spring Data Redis 配置
spring:
  data:
    redis:
      repositories:
        enabled: false # 项目未使用到 Spring Data Redis 的 Repository，所以直接禁用，保证启动速度

# VO 转换（数据翻译）相关
easy-trans:
  is-enable-global: false # 【默认禁用，对性能确认压力大】启用全局翻译（拦截所有 SpringMVC ResponseBody 进行自动翻译 )。如果对于性能要求很高可关闭此配置，或通过 @IgnoreTrans 忽略某个接口

--- #################### 验证码相关配置 ####################

aj:
  captcha:
    jigsaw: classpath:images/jigsaw # 滑动验证，底图路径，不配置将使用默认图片；以 classpath: 开头，取 resource 目录下路径
    pic-click: classpath:images/pic-click # 滑动验证，底图路径，不配置将使用默认图片；以 classpath: 开头，取 resource 目录下路径
    cache-type: redis # 缓存 local/redis...
    cache-number: 1000 # local 缓存的阈值,达到这个值，清除缓存
    timing-clear: 180 # local定时清除过期缓存(单位秒),设置为0代表不执行
    type: blockPuzzle # 验证码类型 default 三种都实例化。blockPuzzle 滑块拼图、clickWord 文字点选、pictureWord 文本输入
    water-mark: 师砺平台 # 右下角水印文字(我的水印)，可使用 https://tool.chinaz.com/tools/unicode.aspx 中文转 Unicode，Linux 可能需要转 unicode
    interference-options: 0 # 滑动干扰项(0/1/2)
    req-frequency-limit-enable: false # 接口请求次数一分钟限制是否开启 true|false
    req-get-lock-limit: 5 # 验证失败 5 次，get接口锁定
    req-get-lock-seconds: 10 # 验证失败后，锁定时间间隔
    req-get-minute-limit: 30 # get 接口一分钟内请求数限制
    req-check-minute-limit: 60 # check 接口一分钟内请求数限制
    req-verify-minute-limit: 60 # verify 接口一分钟内请求数限制

--- #################### AI 相关配置 ####################

spring:
  ai:
    zhipuai: # 智谱 AI
      api-key: ${SPRING_AI_ZHIPUAI_API_KEY:}
    openai: # OpenAI 官方
      api-key: ${SPRING_AI_OPENAI_API_KEY:}
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://api.openai.com}
    anthropic: # Anthropic Claude
      api-key: ${SPRING_AI_ANTHROPIC_API_KEY:}
    ollama:
      base-url: http://127.0.0.1:11434
      chat:
        model: llama3
    minimax: # Minimax：https://www.minimaxi.com/
      api-key: ${SPRING_AI_MINIMAX_API_KEY:}
    moonshot: # 月之暗面（KIMI）
      api-key: ${SPRING_AI_MOONSHOT_API_KEY:}
    deepseek: # DeepSeek
      api-key: ${SPRING_AI_DEEPSEEK_API_KEY:}
      chat:
        options:
          model: deepseek-chat
nus:
  ai:
    edu:
      external-student-data-enabled: ${NUS_AI_EXTERNAL_STUDENT_DATA_ENABLED:false}
      max-concurrent: ${NUS_AI_MAX_CONCURRENT:4}
      call-timeout: ${NUS_AI_CALL_TIMEOUT:120s} # 单次尝试等待模型响应的上限
      connect-timeout: ${NUS_AI_CONNECT_TIMEOUT:10s}
      hard-timeout: ${NUS_AI_HARD_TIMEOUT:180s} # 一次调用（含重试）的总时限；剩余时间不够一次完整尝试时不再重试
      max-attempts: ${NUS_AI_MAX_ATTEMPTS:3} # 含第一次；只对限流、5xx、超时和连接失败重试
      background-permit-wait: ${NUS_AI_BACKGROUND_PERMIT_WAIT:60s} # 后台任务在并发已满时最多排队等待多久
--- #################### 师砺平台相关配置 ####################

nus:
  info:
    version: 1.0.0
    base-package: cn.nus.zknu
  web:
    admin-ui:
      url: ${NUS_SITE_URL:http://localhost} # 平台访问地址
  xss:
    enable: false
    exclude-urls: # 管理监控接口不参与 XSS 请求转换
      - ${spring.boot.admin.context-path}/** # 不处理 Spring Boot Admin 的请求
      - ${management.endpoints.web.base-path}/** # 不处理 Actuator 的请求
  security:
  api-encrypt:
    enable: false # 是否开启 API 加密；前后端需同时开启
    algorithm: AES # 加密算法，支持 AES、RSA 等
    request-key: ${NUS_API_ENCRYPT_REQUEST_KEY:0123456789abcdef}
    response-key: ${NUS_API_ENCRYPT_RESPONSE_KEY:fedcba9876543210}
  swagger:
    title: 师砺平台接口文档
    description: 师砺平台教学管理、能力培养与 AI 辅助服务接口
    version: ${nus.info.version}
    url: ${nus.web.admin-ui.url}
    email: ${NUS_CONTACT_EMAIL:}
    license: MIT
    license-url: ${NUS_LICENSE_URL:${nus.web.admin-ui.url}/LICENSE}

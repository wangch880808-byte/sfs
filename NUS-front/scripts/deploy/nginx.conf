worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 520m;

  log_format nus '$remote_addr - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                 'request_time=$request_time upstream_time=$upstream_response_time '
                 'trace_id=$http_x_trace_id';
  access_log /dev/stdout nus;
  error_log /dev/stderr warn;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $arg_theme $horizon_theme {
    default horizon;
    light daybreak;
    dark horizon;
  }

  server {
    listen 8080;
    server_name _;

    location = /nginx-health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'ok\n';
    }

    location /admin-api/ {
      proxy_pass http://backend:48080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Trace-Id $http_x_trace_id;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    # SSE 流式接口（AI 对话、AI 研判）：关闭缓冲，否则内容要攒满缓冲区才一次性到达浏览器。
    location ~ ^/admin-api/.+-stream$ {
      proxy_pass http://backend:48080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Trace-Id $http_x_trace_id;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    location /druid/ {
      auth_request /_monitor_auth_druid;
      proxy_pass http://backend:48080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # Druid only trusts the internal reverse proxy; the client IP remains in the Nginx access log.
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
      auth_request /_monitor_auth_java;
      proxy_pass http://backend:48080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-NUS-Monitor-Gateway 1;
    }

    location = /_monitor_auth_druid {
      internal;
      proxy_pass http://backend:48080/admin-api/infra/monitor-access/verify?target=DRUID;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie $http_cookie;
    }

    location = /_monitor_auth_java {
      internal;
      proxy_pass http://backend:48080/admin-api/infra/monitor-access/verify?target=JAVA;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie $http_cookie;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      index index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
      root /usr/share/nginx/html;
    }
  }

  server {
    listen 8082;
    server_name _;

    location = /_monitor_auth_skywalking {
      internal;
      proxy_pass http://backend:48080/admin-api/infra/monitor-access/verify?target=SKYWALKING;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie $http_cookie;
    }

    location = /__nus_theme {
      auth_request /_monitor_auth_skywalking;
      default_type text/html;
      add_header Cache-Control "no-store" always;
      return 200 '<!doctype html><meta charset="utf-8"><script>localStorage.setItem("horizon:theme:user","$horizon_theme");location.replace("/");</script>';
    }

    location / {
      auth_request /_monitor_auth_skywalking;
      proxy_pass http://skywalking-ui:8081;
      proxy_http_version 1.1;
      proxy_set_header Host $host:$server_port;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 300s;
    }
  }
}
